[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmas-observability"
version = "0.1.0"
description = "Fail-open observability SDK and gMAS callback integration"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gmas_observability"]
