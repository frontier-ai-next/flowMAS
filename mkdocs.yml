site_name: flowMAS
site_description: Graph-native studio and observability for mutable multi-agent workflows
site_url: https://frontier-ai-next.github.io/flowMAS/
repo_url: https://github.com/frontier-ai-next/flowMAS
repo_name: frontier-ai-next/flowMAS
edit_uri: edit/main/docs/

exclude_docs: |
  HF_SPACES.md
  requirements.txt

theme:
  name: material
  language: en
  font: false
  icon:
    logo: material/graph-outline
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Follow system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Overview: index.md
  - Getting started: GETTING_STARTED.md
  - Concepts:
      - Architecture: ARCHITECTURE.md
      - UI guide: UI_GUIDE.md
      - Observability: OBSERVABILITY.md
  - Evaluation: EVALUATION.md
  - Operations:
      - Deployment: DEPLOYMENT.md
  - Comparison:
      - Langflow feature parity: LANGFLOW_PARITY.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frontier-ai-next/flowMAS
      name: flowMAS on GitHub
    - icon: material/open-in-new
      link: https://gmas.frontierai.ru/
      name: Open the live demo

copyright: Copyright &copy; 2026 flowMAS contributors · MIT License
