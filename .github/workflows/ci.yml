name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source and gMAS
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/web/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and gMAS
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python \
            -e vendor/gmas \
            -e packages/gmas-observability \
            -e "apps/api[dev]"

      - name: Smoke-test application import
        run: .venv/bin/python -c "from backend.main import app; print(len(app.routes), 'routes')"
        env:
          PYTHONPATH: apps/api

      - name: Test
        run: cd apps/api && ../../.venv/bin/python -m pytest -q tests

  observability:
    name: Observability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source and gMAS
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv
          uv pip install --python .venv/bin/python \
            -e "packages/gmas-observability[dev]" \
            -e "apps/observability[dev]"

      - name: Test SDK
        run: .venv/bin/python -m pytest -q packages/gmas-observability/tests

      - name: Test service
        run: .venv/bin/python -m pytest -q apps/observability/tests
