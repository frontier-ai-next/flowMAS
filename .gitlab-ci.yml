variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_FORCE_HTTPS: "true"
  GIT_SUBMODULE_DEPTH: 1

stages:
  - test
  - build

web:typecheck:
  stage: test
  image: node:22
  before_script:
    - corepack enable
    - cd apps/web && pnpm install --frozen-lockfile
  script:
    - pnpm exec tsc --noEmit -p tsconfig.json

web:test:
  stage: test
  image: node:22
  before_script:
    - corepack enable
    - cd apps/web && pnpm install --frozen-lockfile
  script:
    - pnpm test

api:test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  variables:
    PYTHONPATH: apps/api
  before_script:
    - uv pip install --system -e vendor/gmas -e packages/gmas-observability -e "apps/api[dev]"
  script:
    - python -c "import gmas; from backend.main import app; print('ok', len(app.routes), 'routes')"
    - cd apps/api && python -m pytest -q tests

observability:test:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - uv pip install --system -e "packages/gmas-observability[dev]" -e "apps/observability[dev]"
  script:
    - python -m pytest -q packages/gmas-observability/tests
    - python -m pytest -q apps/observability/tests

web:build:
  stage: build
  image: node:22
  before_script:
    - corepack enable
    - cd apps/web && pnpm install --frozen-lockfile
  script:
    - pnpm run build
  artifacts:
    paths:
      - apps/web/dist
    expire_in: 1 week
